[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wizard-chess"
version = "0.1.0"
description = "Desktop chess prototype with an authoritative digital board state"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.8",
    "python-chess>=1.999",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.2",
]

[project.scripts]
wizard-chess = "wizard_chess.main:run"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wizard_chess"]
artifacts = ["src/wizard_chess/engine/bundled/**"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["AGENT_INSTRUCTION*.md", "AGENT_INSTRUCTIONS*.md", "AGENTS.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
